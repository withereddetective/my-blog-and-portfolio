<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withered Detective</title>
  <link rel="icon" type="image/jpeg" href="assets/channels4_profile.jpg">
  <!-- GitHub Markdown CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
  <link rel="stylesheet" href="style.css">
  <!-- Marked.js for parsing Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Animated Purple Background -->
  <div class="bg-animation"></div>

  <!-- Fixed Header -->
  <header class="fixed-header">
    <nav id="site-nav">
      <a href="#home" class="nav-link active" data-tab="home">home</a> |
      <a href="#about" class="nav-link" data-tab="about">about</a> |
      <a href="#current" class="nav-link" data-tab="current">current projects</a> |
      <a href="#completed" class="nav-link" data-tab="completed">completed projects</a>
    </nav>
    <nav id="game-nav" hidden aria-label="Arrow Game navigation"></nav>
    <nav id="blackjack-nav" hidden aria-label="Blackjack navigation"></nav>
    <button id="whiteboard-button" class="whiteboard-button" type="button" aria-label="Show a whiteboard message" disabled>
      <img src="assets/whiteboard.png" alt="">
      <span id="whiteboard-message" class="whiteboard-message" role="status" aria-live="polite" hidden></span>
    </button>
    <pre id="donut-animation" class="donut-animation" aria-hidden="true"></pre>
  </header>

  <!-- Main Scrollable Content Area -->
  <main class="content-wrapper">
    <section id="tab-home" class="tab-content active"></section>
    <section id="tab-about" class="tab-content centered-tab"></section>
    <section id="tab-current" class="tab-content"></section>
    <section id="tab-completed" class="tab-content"></section>
  </main>

  <div id="arrow-game-root" hidden></div>
  <div id="blackjack-root" hidden></div>

  <!-- Fixed Footer -->
  <footer class="fixed-footer">
    <span class="footer-copy">Created by <a href="https://github.com/withereddetective" target="_blank">Kyle Haynes</a> Contact: <a href="mailto:withereddetective1@gmail.com">withereddetective1@gmail.com</a></span>
  </footer>

  <div id="plant-widget" class="plant-widget">
    <p id="plant-message" class="plant-message" role="status" aria-live="polite" hidden></p>
    <img class="watering-can" src="assets/watering-can.png" alt="" aria-hidden="true">
    <svg class="water-stream" viewBox="0 0 90 82" aria-hidden="true">
      <path d="M2 50 C24 52 27 62 48 68 C60 70 69 74 78 77"></path>
      <path d="M8 47 C30 50 34 60 54 66 C66 70 76 74 85 75"></path>
    </svg>
    <button id="plant-button" class="plant-button" type="button" aria-label="Water the plant">
      <img src="assets/plant.png" alt="">
    </button>
    <span id="visit-count" class="visit-count" aria-live="polite">Loading visits...</span>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
